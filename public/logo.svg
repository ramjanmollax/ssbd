<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Rounded Background Badge -->
    <rect width="64" height="64" rx="18" fill="#064e3b"/>
    
    <!-- Sprout and Leaves -->
    <path d="M32 50 V 26" stroke="#a7f3d0" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Left Leaf -->
    <path d="M32 34 C 18 20, 10 26, 14 42 C 22 46, 29 40, 32 34 Z" fill="url(#leafGrad)"/>
    <!-- Right Leaf with Gold Accent -->
    <path d="M32 28 C 46 14, 54 20, 50 36 C 42 42, 35 34, 32 28 Z" fill="url(#goldGrad)"/>
    <!-- Center Seed Dot -->
    <circle cx="32" cy="52" r="3.5" fill="#fef08a"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main Brand Title -->
  <text x="88" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="-0.5">
    SS <tspan fill="#059669">SEED</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="90" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="2">
    PREMIUM SEED &amp; GARDEN
  </text>
</svg>
