services:
  seedhaven-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seedhaven_web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SITE_URL=${SITE_URL:-https://seedhavenbd.com}
      - APP_URL=${APP_URL:-https://seedhavenbd.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - META_PIXEL_ID=${META_PIXEL_ID:-}
      - META_CAPI_ACCESS_TOKEN=${META_CAPI_ACCESS_TOKEN:-}
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID:-1kPzbYFUkgN8dW5BVqeNtoKM8LbRvHAIfQIQZBKkv-Ws}
    volumes:
      # Persistent local storage for orders, secure settings, and uploaded pictures
      - seedhaven_data:/app/data
      - seedhaven_uploads:/app/public/uploads

volumes:
  seedhaven_data:
    driver: local
  seedhaven_uploads:
    driver: local
